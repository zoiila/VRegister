<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 840" width="1680" height="840" role="img"><title>Registration has a backbone. — VRegister by VACK Studio</title><g transform="rotate(-0.85 840 428)"><rect x="135" y="120" width="1418" height="669" rx="8" fill="#03060C" opacity=".45"/><rect x="124" y="109" width="1429" height="669" rx="7" fill="#352C4D" opacity=".78"/><rect x="112" y="93" width="1429" height="669" rx="5" fill="#1B202A" stroke="#454A5B" stroke-width="2"/><path d="M112 93H1541" stroke="#B8A0EA" stroke-width="2.5" opacity=".65"/><text x="194" y="172" fill="#B8A0EA" font-family="Inter,Arial,Helvetica,sans-serif" font-size="20" font-weight="750" letter-spacing="2">03  /  ACCOUNT STATE</text><text x="192" y="265" fill="#F8F7FC" font-family="Inter,Arial,Helvetica,sans-serif" font-size="67" font-weight="730" letter-spacing="-2">Registration has a backbone.</text><text x="196" y="310" fill="#B5BDCD" font-family="Inter,Arial,Helvetica,sans-serif" font-size="25" font-weight="450">Three responsibilities documented by VRegister.</text><path d="M195 348H1434" fill="none" stroke="#4B5263" stroke-width="1.5" opacity="1"/><text x="210" y="421" fill="#B8A0EA" font-family="Inter,Arial,Helvetica,sans-serif" font-size="18" font-weight="710" letter-spacing="1.5">01</text><text x="268" y="423" fill="#F8F7FC" font-family="Inter,Arial,Helvetica,sans-serif" font-size="50" font-weight="720" letter-spacing="-1">BCrypt</text><text x="712" y="423" fill="#F8F7FC" font-family="Inter,Arial,Helvetica,sans-serif" font-size="29" font-weight="530" letter-spacing="-0.5">Password hashes</text><text x="715" y="457" fill="#B5BDCD" font-family="Inter,Arial,Helvetica,sans-serif" font-size="20" font-weight="430">Hash storage is described, not plain-text passwords.</text><path d="M208 488H1423" fill="none" stroke="#4B5263" stroke-width="1.2" opacity="0.8"/><text x="210" y="526" fill="#B8A0EA" font-family="Inter,Arial,Helvetica,sans-serif" font-size="18" font-weight="710" letter-spacing="1.5">02</text><text x="268" y="528" fill="#F8F7FC" font-family="Inter,Arial,Helvetica,sans-serif" font-size="50" font-weight="720" letter-spacing="-1">SQLite</text><text x="712" y="528" fill="#F8F7FC" font-family="Inter,Arial,Helvetica,sans-serif" font-size="29" font-weight="530" letter-spacing="-0.5">Account persistence</text><text x="715" y="562" fill="#B5BDCD" font-family="Inter,Arial,Helvetica,sans-serif" font-size="20" font-weight="430">The public README identifies SQLite account storage.</text><path d="M208 593H1423" fill="none" stroke="#4B5263" stroke-width="1.2" opacity="0.8"/><text x="210" y="631" fill="#B8A0EA" font-family="Inter,Arial,Helvetica,sans-serif" font-size="18" font-weight="710" letter-spacing="1.5">03</text><text x="268" y="633" fill="#F8F7FC" font-family="Inter,Arial,Helvetica,sans-serif" font-size="50" font-weight="720" letter-spacing="-1">Sessions</text><text x="712" y="633" fill="#F8F7FC" font-family="Inter,Arial,Helvetica,sans-serif" font-size="29" font-weight="530" letter-spacing="-0.5">Login state</text><text x="715" y="667" fill="#B5BDCD" font-family="Inter,Arial,Helvetica,sans-serif" font-size="20" font-weight="430">Session management is listed as a core responsibility.</text><path d="M208 698H1423" fill="none" stroke="#4B5263" stroke-width="1.2" opacity="0.8"/><path d="M195 715H1434" fill="none" stroke="#4B5263" stroke-width="1.6" opacity="0.75"/><text x="196" y="752" fill="#8E9AAA" font-family="Inter,Arial,Helvetica,sans-serif" font-size="16" font-weight="650" letter-spacing="1">NO INVENTED DATABASE TABLES   /   NO PRIVATE SOURCE OR PASSWORD DATA SHOWN</text></g></svg>